name = "kbl-live-alerts"
main = "src/index.ts"
compatibility_date = "2024-09-25"

# 무료 티어 Cron Trigger 최소 간격은 1분 - "10초마다"는 이 간격으로 시작해서, 깨어난 김에
# index.ts가 내부적으로 몇 차례 더 짧게 재조회하며 좁혀보는 식으로 접근함(README/plan 참고).
[triggers]
crons = ["*/1 * * * *"]

# `wrangler kv namespace create ALERTS_KV` 실행 후 나오는 id로 교체 - 계정 생성 전이라
# 아직 실제 id가 없음(플레이스홀더).
[[kv_namespaces]]
binding = "ALERTS_KV"
id = "REPLACE_WITH_REAL_KV_ID"
