name: KBL Live Collector

# 노트북 대신 매일 자동으로 도는 라이브 수집기(요청: "노트북이 켜져있어야만 실시간 중계가
# 가능한거야?ㅠㅠ" - 2026-09-24). tools/live_collector.py 자체는 안 바꿨다 - 그 스크립트가
# 내부적으로 60초 간격 폴링 루프를 이미 갖고 있어서(--interval 기본 60), 여기선 하루 한 번
# 트리거만 걸고 그 안에서 계속 돌게 한다(작업 스케줄러의 "13시부터 10분마다 재시작" 방식과
# 다름 - 그쪽은 재시작 자체가 안전장치였는데, GitHub Actions 잡 하나가 오래 살 수 있어서
# 그럴 필요가 없다).
#
# GitHub Actions 잡은 최대 6시간(360분)에서 강제 종료된다 - 로컬 작업 스케줄러의 12시간
# 기본값보다 짧다. --max-runtime을 5시간 50분(20700초)으로 잡아 그 안에서 스크립트가 먼저
# 곱게 종료하게 한다. 아주 늦게 끝나는 3연전(13시 시작~21시 이후)은 이 한도에 걸릴 수 있음 -
# 실제로 문제가 되면 트리거를 하나 더 늦은 시각에 추가하는 걸로 보완할 것.
#
# 필요한 시크릿: DATABASE_URL (Supabase 직결, RLS 우회 - tools/.env.supabase와 같은 값),
# REVALIDATE_TOKEN (경기 종료 정산 직후 courtside-web 캐시 무효화용, daily-batch.yml과 공유).

on:
  schedule:
    # 04:00 UTC = 13:00 KST (기존 작업 스케줄러 KBL_LiveCollector와 같은 시각)
    - cron: "0 4 * * *"
  workflow_dispatch: {} # 수동 테스트용

# 같은 잡이 둘 이상 동시에 돌지 않게 한다(2026-09-25). schedule 트리거는 GitHub 부하에 따라 수십 분~
# 수 시간 늦게 뜨는 게 실측됨(daily-batch가 06:00 KST 예정인데 08:42 KST에 시작) - 그래서 중요한 날엔
# workflow_dispatch로 제때 수동 기동해두는데, 그러면 늦게 뜬 schedule 실행이 그 위에 겹쳐 분(minute)을
# 이중으로 태우고 같은 경기를 두 곳에서 폴링하게 된다. cancel-in-progress: false = 돌고 있는 실행은
# 절대 안 죽이고, 뒤에 온 실행은 대기(끝나면 오늘 남은 경기가 없어 바로 종료됨).
concurrency:
  group: live-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # GitHub 강제 한도(360분)보다 살짝 짧게 - 로그가 안 잘리고 남게
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
      PYTHONUNBUFFERED: "1" # 로그가 잡 종료 전까지 버퍼에 갇혀 안 보이는 것 방지
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Run live collector
        working-directory: tools
        run: |
          python live_collector.py --max-runtime 20700 --stall-timeout 5400
