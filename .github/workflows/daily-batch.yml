name: KBL Daily Batch

# 라이브 수집기가 놓친 경기를 다음날 아침에 정본으로 복구하는 경로(작업 스케줄러
# KBL_DailyBatch와 동일한 목적) - 2026-09-24, 클라우드 이전의 두 번째 절반.
# 이 잡은 오래 안 돈다(수 분 내 종료) - live-collector.yml과 달리 타임아웃 걱정 없음.
#
# 필요한 시크릿: DATABASE_URL, REVALIDATE_TOKEN (둘 다 live-collector.yml과 공유).

on:
  schedule:
    # 21:00 UTC(전날) = 06:00 KST
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # tools/cache_invalidate.py가 쓰는 값 - Supabase 쓰기 직후 courtside-web 캐시를 즉시
      # 무효화한다(2026-09-25, revalidateTag 연동). 없어도 스크립트는 안 죽고 그냥 예전처럼
      # TTL 만료까지 기다리는 동작으로 후퇴한다.
      REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Run daily batch
        working-directory: tools
        run: |
          python daily_batch.py
